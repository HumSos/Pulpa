<!doctype html>
<html lang="es">
{% set ruta = request.url.path %}
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}{{ titulo | default("Sistema Pulpa") }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='estilos.css') }}">
  <script src="{{ url_for('static', path='htmx.min.js') }}"></script>
</head>
<body>
  <aside class="barra-lateral">
    <a class="marca" href="/">
      <strong>Pulpa</strong>
      <span>Sistema administrativo</span>
    </a>
    <nav>
      <a href="/" class="{{ 'activo' if ruta == '/' }}">Tablero</a>

      <p class="grupo">Operación</p>
      <a href="/pedidos" class="{{ 'activo' if ruta.startswith('/pedidos') }}">Pedidos</a>
      <a href="/compras" class="{{ 'activo' if ruta.startswith('/compras') }}">Compras</a>
      <a href="/cobranza" class="{{ 'activo' if ruta.startswith('/cobranza') }}">Cobranza</a>

      <p class="grupo">Catálogos</p>
      <a href="/productos" class="{{ 'activo' if ruta.startswith('/productos') }}">Productos</a>
      <a href="/clientes" class="{{ 'activo' if ruta.startswith('/clientes') }}">Clientes</a>
      <a href="/proveedores" class="{{ 'activo' if ruta.startswith('/proveedores') }}">Proveedores</a>
    </nav>
  </aside>

  <main>
    <div class="contenido">{% block contenido %}{% endblock %}</div>
  </main>
</body>
</html>
