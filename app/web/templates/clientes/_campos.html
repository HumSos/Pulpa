<label>Nombre del negocio
  <input name="nombre_negocio" required maxlength="150" value="{{ datos.nombre_negocio or '' }}">
</label>
<label>Contacto
  <input name="nombre_contacto" maxlength="150" value="{{ datos.nombre_contacto or '' }}">
</label>
<label>Teléfono
  <input name="telefono" type="tel" maxlength="30" value="{{ datos.telefono or '' }}">
</label>
<label>Correo
  <input name="email" type="email" maxlength="150" value="{{ datos.email or '' }}">
</label>
<label>Dirección principal
  <input name="direccion" maxlength="300" value="{{ datos.direccion or '' }}">
</label>
<label>Días de crédito (0 = contado)
  <input name="dias_credito" type="number" min="0" max="180" step="1"
         value="{{ datos.dias_credito | default(0) }}">
</label>
